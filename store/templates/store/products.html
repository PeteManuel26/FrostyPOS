{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FrostPOS - Products</title>
<link rel="stylesheet" href="{% static 'store/css/style.css' %}">
</head>
<body>
<div class="container">
<div class="header">
    <h2>Frozen Products</h2>
</div>

<div class="actions">
    <a href="{% url 'scan_barcode' %}">Scan Barcode</a>
    <a href="{% url 'cart' %}">View Cart</a>
</div>

<ul>
{% for p in products %}
    <li>
        <strong>{{ p.name }}</strong> - ₱{{ p.price }}  
        <br>
        Stock: {{ p.stock }}
        {% if p.stock > 0 %}
            <a href="{% url 'add_to_cart' p.id %}">Add</a>
        {% else %}
            <span class="out-of-stock">Out of Stock</span>
        {% endif %}
    </li>
{% endfor %}
</ul>

</div>
</body>
</html>
